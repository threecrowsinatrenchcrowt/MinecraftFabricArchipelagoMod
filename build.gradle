plugins {
	id 'fabric-loom' version '1.8.0-alpha.16'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://api.modrinth.com/maven" }
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.architectury.dev/" }

	// All of the following are for Create:
	// Based on https://github.com/Fabricators-of-Create/create-fabric-addon-template/blob/1.20.1/build.gradle
	maven { url = "https://mvn.devos.one/releases" } // Porting Lib releases
	maven { url = "https://mvn.devos.one/snapshots" } // Create and several dependencies
	maven { url = "https://maven.createmod.net/" } // Flywheel
	maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
	maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" } // Forge Config API Port
	maven { // Fabric ASM for Porting Lib
		url = "https://jitpack.io/"
		content { includeGroupAndSubgroups("com.github") }
	}
}
loom {
	accessWidenerPath = file("src/main/resources/archipelago.accesswidener")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "maven.modrinth:koala_lib:${koala_lib_version}"

	include "io.github.archipelagomw:Java-Client:${archipelago_client_version}"

	// Includes these since they are Archipelago Dependencies
	include "com.google.code.gson:gson:2.13.2"
	include "org.apache.httpcomponents.client5:httpclient5:5.5"
	include "org.apache.httpcomponents.core5:httpcore5:5.3.6"
	include "org.java-websocket:Java-WebSocket:1.6.0"

	implementation "io.github.archipelagomw:Java-Client:${archipelago_client_version}"

	// Optional Dependencies
	modCompileOnly "maven.modrinth:jade:${jade_version}"
	modCompileOnly "maven.modrinth:jei:${jei_version}"
	modCompileOnly "maven.modrinth:fPetb5Kh:${natures_compass_version}"
	modCompileOnly "maven.modrinth:RV1qfVQ8:${explorers_compass_version}"

	modCompileOnly "dev.architectury:architectury-fabric:${architectury_version}"
	modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
	modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"

	modCompileOnly "com.simibubi.create:create-fabric:${create_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}